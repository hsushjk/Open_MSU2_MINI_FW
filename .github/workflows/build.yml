name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GCC_VERSION: 14.2.0-3
  GCC_DIR: xpack-riscv-none-elf-gcc-14.2.0-3

jobs:
  firmware:
    name: firmware (riscv-none-elf-gcc)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: ~/.cache/xpack
          key: xpack-riscv-none-elf-gcc-${{ env.GCC_VERSION }}-linux-x64

      - name: Fetch toolchain
        run: |
          set -euo pipefail
          cache="$HOME/.cache/xpack"
          mkdir -p "$cache"
          if [ ! -x "$cache/$GCC_DIR/bin/riscv-none-elf-gcc" ]; then
            curl -fsSL -o "$cache/$GCC_DIR.tar.gz" \
              "https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v$GCC_VERSION/$GCC_DIR-linux-x64.tar.gz"
            tar -xf "$cache/$GCC_DIR.tar.gz" -C "$cache"
          fi
          echo "RISCV_TOOLCHAIN=$cache/$GCC_DIR/bin" >> "$GITHUB_ENV"

      - name: Build
        shell: pwsh
        run: ./build.ps1 -Variant proto

      - name: Check artifacts
        run: |
          set -euo pipefail
          test -s build/msu2_proto_fw.hex
          test -s build/msu2_proto_fw.bin
          grep -q '^:' build/msu2_proto_fw.hex
          ls -l build/msu2_proto_fw.hex build/msu2_proto_fw.bin

      - uses: actions/upload-artifact@v4
        with:
          name: msu2_proto_fw
          path: |
            build/msu2_proto_fw.hex
            build/msu2_proto_fw.bin
          if-no-files-found: error
          retention-days: 30

  release:
    name: release
    needs: firmware
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check tag against src/fw.h
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          major=$(sed -n 's/^#define FW_VER_MAJOR[[:space:]]*\([0-9][0-9]*\).*/\1/p' src/fw.h)
          minor=$(sed -n 's/^#define FW_VER_MINOR[[:space:]]*\([0-9][0-9]*\).*/\1/p' src/fw.h)
          patch=$(sed -n 's/^#define FW_VER_PATCH[[:space:]]*\([0-9][0-9]*\).*/\1/p' src/fw.h)
          firmware="$major.$minor.$patch"
          echo "tag=$tag firmware=$firmware"
          test "$tag" = "$firmware"

      - uses: actions/download-artifact@v4
        with:
          name: msu2_proto_fw
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/msu2_proto_fw.hex
            dist/msu2_proto_fw.bin
          fail_on_unmatched_files: true